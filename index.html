
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SFMC Contact Form</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 32px 16px;
      font: 16px Arial, sans-serif;
      background: #f3f6fb;
      color: #202938;
    }

    main {
      max-width: 460px;
      margin: 30px auto;
      padding: 28px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 8px 30px #1b2b4412;
    }

    h1 { font-size: 24px; }

    label {
      display: block;
      margin-top: 18px;
      font-weight: 600;
    }

    input, button {
      width: 100%;
      margin-top: 8px;
      padding: 12px;
      border-radius: 7px;
      font: inherit;
    }

    input { border: 1px solid #cbd5e1; }

    button {
      margin-top: 24px;
      border: 0;
      background: #0875d1;
      color: white;
      cursor: pointer;
    }

    button:disabled { opacity: .6; cursor: wait; }

    #status { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main>
    <h1>Contact Form</h1>
    <p>Submit your details to Salesforce Marketing Cloud.</p>

    <form id="contactForm">
      <label for="name">Full name *</label>
      <input id="name" name="name" maxlength="100" required>

      <label for="email">Email address *</label>
      <input id="email" name="email" type="email"
             maxlength="254" required>

      <label for="phone">Phone number</label>
      <input id="phone" name="phone" type="tel" maxlength="30">

      <button type="submit">Submit</button>
    </form>

    <p id="status" role="status" aria-live="polite"></p>
  </main>

 <script>
    const form = document.getElementById("contactForm");
    const status = document.getElementById("status");
    const button = form.querySelector("button");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      status.textContent = "";
      status.className = "";

      const nameInput = document.getElementById("name");
      const emailInput = document.getElementById("email");
      const phoneInput = document.getElementById("phone");

      // Validate Name
      if (!nameInput.value.trim()) {
        status.className = "status-error";
        status.textContent = "Please enter your full name.";
        nameInput.focus();
        return;
      }

      // Validate Email format
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailInput.value.trim() || !emailRegex.test(emailInput.value.trim())) {
        status.className = "status-error";
        status.textContent = "Please enter a valid email address (e.g., name@example.com).";
        emailInput.focus();
        return;
      }

      button.disabled = true;
      status.textContent = "Submitting...";

      try {
        const payload = {
          name: nameInput.value.trim(),
          email: emailInput.value.trim(),
          phone: phoneInput.value.trim()
        };

        const response = await fetch("/api/submit", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        // Safely parse JSON response to prevent unexpected syntax errors
        const text = await response.text();
        let result;
        try {
          result = JSON.parse(text);
        } catch (e) {
          throw new Error("Received an invalid response from the server.");
        }

        if (!response.ok || !result.success) {
          throw new Error(result.message || "Submission failed.");
        }

        status.className = "status-success";
        status.textContent = result.message + (result.requestId ? " (Request ID: " + result.requestId + ")" : "");
        form.reset();
      } catch (error) {
        status.className = "status-error";
        status.textContent = error.message || "Something went wrong. Please try again.";
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
