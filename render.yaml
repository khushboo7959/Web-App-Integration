
services:
  - type: web
    name: sfmc-de-form-integration
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SFMC_AUTH_URL
        sync: false
      - key: SFMC_REST_URL
        sync: false
      - key: SFMC_CLIENT_ID
        sync: false
      - key: SFMC_CLIENT_SECRET
        sync: false
      - key: SFMC_ACCOUNT_ID
        sync: false
      - key: SFMC_DE_KEY
        sync: false
